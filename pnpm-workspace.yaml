minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@kikiutils/shared'
  - '@types/bun'
  - bun-types

resolutionMode: highest
trustPolicy: no-downgrade
strictSsl: true
preferFrozenLockfile: true
shellEmulator: true
updateNotifier: false

allowBuilds:
  msgpackr-extract: true
